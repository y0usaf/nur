[package]
name    = "nur"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nur"
path = "src/main.rs"

[dependencies]
gpui.workspace    = true
runtime.workspace = true
assets.workspace  = true

anyhow             = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { version = "4", features = ["derive"] }
serde              = { workspace = true }
serde_json         = { workspace = true }
